<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de madurez digital</title>
<style>
:root{--bg:#f2f5f7;--ink:#14202b;--mut:#5a6b78;--line:#cdd7de;--acc:#0b6e6e;--card:#fff;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--acc)}
.sub{color:var(--mut);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:10px}
input[type=text],input[type=number],input[type=date],select{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
fieldset.ind{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:10px 10px 6px}
fieldset.ind.miss{border-color:var(--err)}
legend{font-weight:700;padding:0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:5px;cursor:pointer}
.opt:hover{background:#eef3f5}
.opt input{margin-top:3px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.opt b{min-width:1.1em}
.ev{display:flex;gap:18px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:.92rem}
.ev label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sin{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:12px}
.hint{color:var(--mut);font-size:.88rem;margin:0 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:13px 18px;background:var(--acc);color:#fff;width:100%;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#fff;color:var(--acc);border:2px solid var(--acc);margin-top:10px}
#msg{margin:12px 0;font-weight:600}
#msg.err{color:var(--err)}
table{width:100%;border-collapse:collapse;margin:8px 0 12px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.tot td{border-bottom:0;font-size:1.1rem}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Diagnóstico de madurez digital</h1>
<p class="sub">Captura de la aplicación en la microempresa. No anotes contraseñas ni datos personales de clientes.</p>

<form id="f" novalidate>
<section>
<h2>Datos generales</h2>
<label class="f">Nombre del negocio<input type="text" id="nombre" autocomplete="off"></label>
<div class="g2">
<label class="f">Giro<input type="text" id="giro"></label>
<label class="f">Empleados (1 a 10)<input type="number" id="emp" min="1" max="10" inputmode="numeric"></label>
</div>
<label class="f">Redes sociales en las que tiene presencia<input type="text" id="redes" placeholder="Ej.: Facebook, Instagram, WhatsApp"></label>
<div class="g2">
<label class="f">Tipo de aplicación<select id="tipo"><option value="">Elegir…</option><option value="inicial">Inicial</option><option value="final">Final</option></select></label>
<label class="f">Fecha<input type="date" id="fecha"></label>
</div>
<label class="f">Aplicador<input type="text" id="aplicador"></label>
</section>

<div id="dims"></div>

<section>
<h2>Métricas de actividad en línea</h2>
<p class="hint">Déjalas vacías si no están disponibles; se guardan como «no disponible».</p>
<div class="g2">
<label class="f">Publicaciones (últimos 30 días)<input type="number" id="publicaciones" min="0" inputmode="numeric"></label>
<label class="f">Seguidores (hoy)<input type="number" id="seguidores" min="0" inputmode="numeric"></label>
<label class="f">Alcance (30 días)<input type="number" id="alcance" min="0" inputmode="numeric"></label>
<label class="f">Interacciones (30 días)<input type="number" id="interacciones" min="0" inputmode="numeric"></label>
<label class="f">Mensajes de clientes (4 semanas)<input type="number" id="mensajes_clientes" min="0" inputmode="numeric"></label>
<label class="f">Reseñas en Google Maps<input type="number" id="resenas_maps" min="0" inputmode="numeric"></label>
</div>
</section>

<div id="msg" role="status"></div>
<button type="submit" id="enviar">Guardar diagnóstico</button>
</form>

<section id="res" hidden>
<h2>Resultado guardado</h2>
<table id="tabla"></table>
<button type="button" class="sec" id="nuevo">Nueva aplicación</button>
</section>
</main>

<script>
// Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec)
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyX1n_hN2F_H0y8tCZ8lCEk8wGIdWgGsLHrMixlceUP0JDRVgUIyHpeQRstth4txhJN/exec';

const NIVELES = ['Inexistente','Inicial','Básico','Gestionado','Optimizado'];
const DIMS = [
 ['Presencia en línea',[
  ['Perfil de negocio en redes sociales',['Sin perfil que represente al negocio','Perfil personal, o de negocio sin configurar','Perfil de negocio con nombre, foto y descripción','Cuenta de negocio con contacto, catálogo o enlaces configurados','Nivel 3 en 2 o más redes y revisa estadísticas cada mes']],
  ['Contacto, ubicación y horario',['Ningún dato de contacto en línea','Datos incompletos o desactualizados','Teléfono/WhatsApp, ubicación y horario correctos en su perfil principal','Misma información correcta en todos los canales y la actualiza','Nivel 3 y la verifica al menos cada 3 meses']],
  ['Ficha en Google Maps',['No aparece','Ficha sin reclamar, datos incompletos','Ficha reclamada con datos básicos','Ficha completa y actualizada por el dueño','Nivel 3 y revisa estadísticas o reseñas']]]],
 ['Gestión de contenido',[
  ['Frecuencia de publicación (30 días)',['Ninguna publicación','1 a 3, sin patrón','4 a 7 (alrededor de 1 por semana)','8 o más (2+ por semana), constante','Nivel 3 y ajusta según el desempeño']],
  ['Coherencia visual y de marca',['Sin contenido publicado','Contenido sin elementos en común','Logo o nombre constante; el estilo varía','Estilo reconocible con plantillas en la mayoría','Nivel 3 en todos los canales con lineamientos; evalúa qué funciona']],
  ['Planeación de publicaciones',['No planea','Anota ideas, sin fechas','Planea de forma manual (libreta, notas)','Usa herramienta digital para planear o programar','Nivel 3 y revisa cada mes qué funcionó']]]],
 ['Atención a clientes',[
  ['Canal de contacto directo',['Ninguno en línea','Cuentas personales, sin canal designado','Canal exclusivo del negocio y lo da a conocer','Herramientas de atención (WhatsApp Business, correo propio, formulario)','Nivel 3 con varios canales; prioriza según su uso']],
  ['Tiempo de respuesta (en horario de atención)',['No responde','Varios días','24 a 48 horas','El mismo día','Menos de 1 hora']],
  ['Registro de clientes y pedidos',['Ninguno','Solo chats o notas sueltas','Registro manual constante','Registro digital actualizado','Nivel 3 y lo revisa para decidir o dar seguimiento']]]],
 ['Seguridad básica de la información',[
  ['Contraseñas de las cuentas de negocio',['Sin cuentas digitales del negocio','Repite o comparte contraseñas sin control','Distintas y no compartidas, guardadas de forma informal','Administrador de contraseñas y verificación en dos pasos en la principal','Verificación en dos pasos en todas; cambia contraseñas ante bajas o sospecha']],
  ['Respaldo de clientes y ventas',['Ninguno','Ocasional, sin frecuencia','Manual con frecuencia establecida','Automático en la nube','Nivel 3 y comprueba la recuperación al menos una vez al año']],
  ['Control de accesos a las cuentas',['No sabe quién tiene acceso','Lo sabe de forma aproximada','Nombra a todos los que tienen acceso','Lista de accesos y uso de roles o permisos','Nivel 3 y la revisa al menos cada 3 meses']]]]
];
const SIN_REDES = ['1.1','2.1','2.2','2.3'];
const $ = id => document.getElementById(id);

// ----- construir los indicadores -----
let html = '';
DIMS.forEach((d, i) => {
  html += `<section><h2>Dimensión ${i+1}. ${d[0]}</h2>`;
  d[1].forEach((ind, k) => {
    const id = `${i+1}.${k+1}`;
    html += `<fieldset class="ind" data-id="${id}"><legend>${id} ${ind[0]}</legend>`;
    ind[1].forEach((t, n) => {
      html += `<label class="opt"><input type="radio" name="n${id}" value="${n}"><span><b>${n}</b> ${t}</span></label>`;
    });
    html += `<div class="ev"><span>Evidencia:</span>
      <label><input type="radio" name="e${id}" value="observado"> Observado</label>
      <label><input type="radio" name="e${id}" value="declarado"> Declarado</label></div></fieldset>`;
  });
  if (i === 0) html = html.replace(`<section><h2>Dimensión 1.`, `<section><h2>Dimensión 1.`);
  html += '</section>';
});
$('dims').innerHTML = html;

// Casilla "sin redes sociales" al inicio de la dimensión 1
$('dims').querySelector('section').insertAdjacentHTML('afterbegin',
  '<label class="sin"><input type="checkbox" id="sinredes" style="width:20px;height:20px;accent-color:#0b6e6e"> El negocio no tiene redes sociales (1.1, 2.1, 2.2 y 2.3 = 0)</label>');

$('sinredes').addEventListener('change', e => {
  SIN_REDES.forEach(id => {
    const fs = document.querySelector(`fieldset[data-id="${id}"]`);
    fs.querySelectorAll('input').forEach(r => {
      r.disabled = e.target.checked;
      r.checked = e.target.checked && (r.value === '0' || r.value === 'observado');
    });
    fs.classList.remove('miss');
  });
});

$('fecha').value = new Date().toISOString().slice(0, 10);

// ----- enviar -----
function mostrar(texto, error) { const m = $('msg'); m.textContent = texto; m.className = error ? 'err' : ''; }

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  document.querySelectorAll('.miss').forEach(x => x.classList.remove('miss'));

  const nombre = $('nombre').value.trim(), emp = Number($('emp').value);
  if (!nombre) { mostrar('Escribe el nombre del negocio.', true); $('nombre').focus(); return; }
  if (!(emp >= 1 && emp <= 10)) { mostrar('El número de empleados debe estar entre 1 y 10.', true); $('emp').focus(); return; }
  if (!$('tipo').value) { mostrar('Elige el tipo de aplicación.', true); $('tipo').focus(); return; }
  if (!$('aplicador').value.trim()) { mostrar('Escribe el nombre del aplicador.', true); $('aplicador').focus(); return; }

  const respuestas = []; let primero = null;
  document.querySelectorAll('fieldset.ind').forEach(fs => {
    const id = fs.dataset.id;
    const n = document.querySelector(`input[name="n${id}"]:checked`);
    const e = document.querySelector(`input[name="e${id}"]:checked`);
    if (!n || !e) { fs.classList.add('miss'); primero = primero || fs; return; }
    respuestas.push({ id_indicador: id, nivel: Number(n.value), tipo_evidencia: e.value });
  });
  if (primero) { mostrar('Falta el nivel o el tipo de evidencia en los indicadores marcados en rojo.', true); primero.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (URL_SCRIPT.startsWith('PEGA_AQUI')) { mostrar('Falta pegar la URL de la aplicación web en el archivo (variable URL_SCRIPT).', true); return; }

  const num = id => $(id).value === '' ? null : Number($(id).value);
  const datos = {
    microempresa: { nombre, giro: $('giro').value.trim(), num_empleados: emp, redes_sociales: $('redes').value.trim() },
    aplicacion: { tipo: $('tipo').value, fecha: $('fecha').value, aplicador: $('aplicador').value.trim() },
    respuestas,
    metricas: { publicaciones: num('publicaciones'), seguidores: num('seguidores'), alcance: num('alcance'),
                interacciones: num('interacciones'), mensajes_clientes: num('mensajes_clientes'), resenas_maps: num('resenas_maps') }
  };

  $('enviar').disabled = true; mostrar('Guardando…');
  try {
    const r = await fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datos) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    const filas = j.dimensiones.map((v, i) => `<tr><td>${DIMS[i][0]}</td><td>${v.toFixed(2)}</td></tr>`).join('');
    $('tabla').innerHTML = filas + `<tr class="tot"><td>Nivel general (${j.id_aplicacion})</td><td>${j.general.toFixed(2)} · ${NIVELES[Math.round(j.general)]}</td></tr>`;
    $('f').hidden = true; $('res').hidden = false; window.scrollTo(0, 0);
  } catch (err) {
    mostrar('No se pudo guardar: ' + err.message + ' Tus respuestas siguen en pantalla; revisa la conexión y vuelve a intentar.', true);
    $('enviar').disabled = false;
  }
});

$('nuevo').addEventListener('click', () => location.reload());
</script>
</body>
</html>
